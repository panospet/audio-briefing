<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Audio Briefing</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🎧 Daily Audio Briefing</h1>
    <div class="controls-row">
      <select id="briefing-select" title="Επιλογή briefing"></select>
      <button id="generate-btn" title="Δημιουργία νέου briefing">⟳ Generate now</button>
    </div>
  </header>

  <main>
    <section id="player">
      <div id="now-playing" class="muted">—</div>
      <div class="player-controls">
        <button id="prev" title="Προηγούμενο">⏮</button>
        <button id="play" title="Αναπαραγωγή/Παύση">▶</button>
        <button id="next" title="Επόμενο">⏭</button>
        <div class="seek-wrap">
          <span id="time">0:00</span>
          <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
          <span id="total">0:00</span>
        </div>
        <div class="volume-wrap">
          <span>🔊</span>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
    </section>

    <ol id="playlist"></ol>
  </main>

  <footer class="muted">
    Space: play/pause · ←/→: ±5s · N/P: next/prev
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="/static/player.js"></script>
</body>
</html>
