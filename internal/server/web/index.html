<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Audio Briefing</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🎧</span>
      <h1>Daily Audio Briefing</h1>
    </div>
    <div class="controls-row">
      <select id="briefing-select" title="Επιλογή briefing"></select>
      <button id="generate-btn" title="Δημιουργία νέου briefing">⟳ Generate now</button>
    </div>
  </header>

  <main>
    <nav id="genre-bar" class="genre-bar" aria-label="Music genre"></nav>
    <section id="player" class="player" aria-label="Now playing">
      <div id="now-playing" class="now-playing muted">—</div>
      <div class="player-controls">
        <button id="prev" title="Προηγούμενο" aria-label="Previous">⏮</button>
        <button id="play" title="Αναπαραγωγή/Παύση" aria-label="Play/Pause">▶</button>
        <button id="next" title="Επόμενο" aria-label="Next">⏭</button>
        <div class="seek-wrap">
          <span id="time" class="time">0:00</span>
          <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
          <span id="total" class="time">0:00</span>
        </div>
        <div class="volume-wrap">
          <span aria-hidden="true">🔊</span>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
      </div>
    </section>

    <ol id="playlist" class="playlist"></ol>
  </main>

  <footer class="site-footer muted">
    Space: play/pause · ←/→: ±5s · N/P: next/prev
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="/static/player.js"></script>
</body>
</html>
