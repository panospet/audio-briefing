<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Sonic core</title>
  <desc id="desc">Layered metallic ripples surround a glowing acid lime center.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#29321e"/><stop offset=".65" stop-color="#11160f"/><stop offset="1" stop-color="#090c09"/></radialGradient>
    <radialGradient id="core" cx="35%" cy="28%"><stop stop-color="#f5ffdc"/><stop offset=".17" stop-color="#ddff83"/><stop offset=".5" stop-color="#b3df48"/><stop offset=".82" stop-color="#5a7826"/><stop offset="1" stop-color="#263416"/></radialGradient>
    <linearGradient id="metal" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#4e5c3c"/><stop offset=".18" stop-color="#e5edcf"/><stop offset=".28" stop-color="#6b775b"/><stop offset=".5" stop-color="#1e2719"/><stop offset=".72" stop-color="#8b9a6d"/><stop offset=".83" stop-color="#303a28"/><stop offset="1" stop-color="#11170e"/></linearGradient>
    <linearGradient id="metal2" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#1c2516"/><stop offset=".25" stop-color="#83976a"/><stop offset=".4" stop-color="#d9e7bf"/><stop offset=".48" stop-color="#465238"/><stop offset=".75" stop-color="#151d10"/><stop offset="1" stop-color="#68794e"/></linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".7"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain"><feTurbulence baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .15"/></feComponentTransfer></filter>
  </defs>
