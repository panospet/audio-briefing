    <path d="M400 166c65 0 88 31 132 63s85 52 97 108-14 86-14 136-37 74-85 107-82 64-130 64-82-26-130-64-81-72-85-107-25-102-14-136 53-76 97-108 67-63 132-63Z" stroke="url(#metal)" stroke-width="27"/>
    <path d="M400 214c52 0 71 26 106 51s69 42 78 87-11 69-11 109-30 60-68 86-66 51-105 51-67-20-105-51-65-56-68-86-20-82-11-109 43-61 78-87 54-51 106-51Z" stroke="url(#metal2)" stroke-width="24"/>
